name: Publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3

      - name: Validate before publish
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Publish main image
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix run .#publish-container -- \
            ghcr.io/vpicciuolo/ai-best-model-route:main \
            ghcr.io/vpicciuolo/ai-best-model-route:sha-${GITHUB_SHA}

      - name: Publish version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix run .#publish-container -- \
            "ghcr.io/vpicciuolo/ai-best-model-route:${GITHUB_REF_NAME}" \
            "ghcr.io/vpicciuolo/ai-best-model-route:sha-${GITHUB_SHA}"
